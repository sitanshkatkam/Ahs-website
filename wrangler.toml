name = "ahs-schedule"
main = "worker/index.ts"
compatibility_date = "2026-04-16"

# The built PWA. Anything the Worker doesn't handle as /api/* is served from here.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this the asset layer answers browser navigations before the Worker
# ever runs, and single-page-application handling turns any unmatched path into
# index.html with a 200. That is right for /calendar and wrong for /api: the
# OAuth callback is a top-level navigation, so Google's redirect was landing on
# the app shell and the code was never exchanged. It only showed up in a real
# browser — curl sends Accept: */*, which falls through to the Worker and looks
# perfectly healthy.
run_worker_first = [ "/api/*" ]

# One minute is the finest granularity Cloudflare offers, and it's what a
# "5 minutes before class" alert needs. Vercel's free tier caps cron at once
# per day, which is why the backend lives here.
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_PUBLIC_KEY = "BNu7sDx1aarCJbiLkSrlZ3pmS6-INQ26JKMw5XKoB4pXg7VKJj-MoaUwCllzqkcAJJuAZ8eWcekbLSDjES2w8xM"
VAPID_SUBJECT = "mailto:vihaan5147@gmail.com"
GOOGLE_CLIENT_ID = "356065144650-j20ou04h80rg83c6fj7fjgn7j5820kuh.apps.googleusercontent.com"

# VAPID_PUBLIC_KEY is set at deploy time from .vapid.json (see npm run deploy).
# VAPID_PRIVATE_KEY is a secret: wrangler secret put VAPID_PRIVATE_KEY

# Google sign-in. The client ID is not a secret — it is visible in the redirect
# to Google on every sign-in — so it lives here. The matching secret is set with
#
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# and must never be written into this file, which is committed.

# Subscriptions live here, one row per device. They used to be a single KV
# value holding everyone, which meant every registration rewrote the whole
# school's record — two students hitting subscribe in the same second could
# lose each other's alarms, and the free tier's 1,000 KV writes a day put a
# ceiling of a couple of hundred users on the app.
[[d1_databases]]
binding = "DB"
database_name = "ahs-schedule"
database_id = "0a98f775-b154-4d90-9505-6f600636c42e"
migrations_dir = "migrations"

# KV keeps the calendar feed cache, which is what it's actually good at: one
# key, read constantly, written once an hour for everybody.
[[kv_namespaces]]
binding = "SUBS"
id = "1b2a657c8d2e41f3b7a81eee3f2f3865"

# The push fan-out worker. A service binding call is not a subrequest and
# starts a fresh invocation, so each shard handed over gets its own budget.
[[services]]
binding = "SENDER"
service = "ahs-sender"
