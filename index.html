<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>American High Schedule</title>
    <meta
      name="description"
      content="Today's bell schedule, your classes, and what's coming up at American High School in Fremont."
    />

    <!-- Installed-app behaviour -->
    <!-- The status bar / browser chrome follows the palette rather than
         staying dark in light mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191c22" />
    <!-- No mobile-web-app-capable here, deliberately. It is the legacy Android
         way of asking for a full-screen home-screen launch, and it is what put
         Chrome into full-screen mode and made it post a permanent silent
         "Full screen site controls" notification titled AHS every time the app
         was opened. The manifest already asks for display: standalone, which
         is the standard mechanism and the one an installed app actually obeys,
         so the tag only ever contradicted it. The Apple pair below stays: iOS
         has no manifest support worth relying on and no equivalent notice. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AHS" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
